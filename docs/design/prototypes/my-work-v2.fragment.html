<script>
/* V2.0 原型共用交互；由 build-v2.py 内联到各维护源及预览，不接入业务接口。 */
(() => {
  /** 在一个原生对话框内切换内容，保留上一步表单、滚动位置和焦点。 */
  function createDialog(root, { restore, exit } = {}) {
    root.classList.add('v2-scope');
    const host = document.createElement('dialog');
    host.className = 'v2-dialog';
    root.append(host);
    let current = null, stack = [], origin = null, pending = null;
    const signature = node => JSON.stringify([...node.querySelectorAll('input,select,textarea')].map(input => [input.name || input.dataset.edit, input.value, input.checked]));
    const dirty = entry => entry && signature(entry.node) !== entry.original;

    function mount(entry) {
      host.replaceChildren(entry.node);
      host.setAttribute('aria-label', entry.title);
      host.classList.toggle('v2-wide', entry.wide);
      entry.node.querySelector('[data-v2-back]').hidden = !stack.length;
      if (!host.open) host.showModal();
      entry.node.querySelector('.v2-content').scrollTop = entry.scroll || 0;
      const focus = entry.focus?.isConnected ? entry.focus : entry.node.querySelector('.v2-content input:not(:disabled),.v2-content select:not(:disabled),.v2-content textarea:not(:disabled)') || entry.node.querySelector('[data-v2-back]:not([hidden]),[data-v2-close]');
      focus?.focus({ preventScroll: true });
    }

    /** 未保存提示占用当前表面，不再增加遮罩；取消保留所有字段。 */
    function guard(action, all = false) {
      if (!dirty(current) && !(all && stack.some(dirty))) { action(); return; }
      pending = action;
      const warning = current.node.querySelector('.v2-unsaved');
      warning.hidden = false;
      warning.querySelector('button').focus();
    }

    function close(force = false) {
      const perform = () => {
        host.close(); host.replaceChildren(); current = null; stack = []; pending = null;
        exit?.();
        if (origin?.isConnected) origin.focus({ preventScroll: true });
        else root.querySelector('main button,button')?.focus({ preventScroll: true });
      };
      if (force) perform(); else guard(perform, true);
    }

    function back(force = false) {
      if (!stack.length) { close(force); return; }
      const perform = () => { current = stack.pop(); mount(current); restore?.(current.context); };
      if (force) perform(); else guard(perform);
    }

    /** 底部操作组居中，依次为关闭、其他操作、保存；右上角保留快捷关闭。 */
    function show({ title, body, actions = '', context = {}, form = false, wide = false, key = '' }) {
      const scroll = current && key && current.key === key ? current.node.querySelector('.v2-content').scrollTop : 0;
      if (!current) origin = document.activeElement;
      else if (!key || key !== current.key) {
        current.scroll = current.node.querySelector('.v2-content').scrollTop;
        current.focus = document.activeElement;
        stack.push(current);
      }
      const node = document.createElement('section');
      node.className = 'v2-dialog-layout';
      node.innerHTML = `<header class="v2-dialog-header"><button type="button" data-v2-back aria-label="返回上一步">← 返回</button><h2></h2><button type="button" data-v2-close aria-label="关闭弹窗" class="v2-close">×</button></header><div class="v2-unsaved" role="alert" hidden><span>有未保存的修改，是否放弃？</span><button type="button" data-v2-keep>继续编辑</button><button type="button" data-v2-discard class="v2-danger">放弃修改</button></div><div class="v2-content"></div><footer class="v2-dialog-footer"><div class="v2-actions v2-footer-actions"><button type="button" data-v2-close>关闭</button></div></footer>`;
      node.querySelector('h2').textContent = title;
      const content = node.querySelector('.v2-content');
      content.innerHTML = form ? `<form data-dialog-form>${body}</form>` : body;
      const source = document.createElement('div'); source.innerHTML = actions;
      // 操作区独立于内容滚动，表单外的保存按钮通过 form 属性继续提交。
      const localActions = content.querySelector('.mw-form-footer');
      if (localActions) { source.append(...localActions.childNodes); localActions.remove(); }
      const formNode = content.querySelector('form');
      if (formNode) formNode.id = root.id + '-v2-form';
      const controls = node.querySelector('.v2-footer-actions');
      const secondary = [], primary = [];
      for (const button of [...source.querySelectorAll('button')]) {
        if (/^(取消|关闭|返回详情|返回任务)$/.test(button.textContent.trim()) || ['cancelDelete','returnMilestone','back-task'].includes(button.dataset.action)) { button.remove(); continue; }
        if (button.type === 'submit' && formNode) button.setAttribute('form', formNode.id);
        if (/删除/.test(button.textContent)) button.classList.add('v2-danger');
        const commits = button.type === 'submit' || button.matches('.nt-primary,.mw-primary,.primary') || /^(保存|确认|加入安排)/.test(button.textContent.trim());
        (commits ? primary : secondary).push(button);
      }
      controls.append(...secondary, ...primary);
      const note = source.textContent.trim();
      if (note) { const info = document.createElement('p'); info.className = 'v2-context'; info.textContent = note; content.prepend(info); }
      current = { title, node, context, wide, key, scroll, original: signature(node) };
      mount(current);
    }

    host.addEventListener('click', event => {
      if (event.target.closest('[data-v2-close]')) close();
      if (event.target.closest('[data-v2-back]')) back();
      if (event.target.closest('[data-v2-keep]')) { current.node.querySelector('.v2-unsaved').hidden = true; pending = null; current.node.querySelector('.v2-content input,.v2-content select,.v2-content textarea')?.focus(); }
      if (event.target.closest('[data-v2-discard]')) { const action = pending; pending = null; action?.(); }
    });
    host.addEventListener('cancel', event => { event.preventDefault(); stack.length ? back() : close(); });
    // 原生 dialog 负责焦点围栏与背景 inert；屏蔽旧页面的 Escape 处理器。
    host.addEventListener('keydown', event => { if (event.key === 'Escape') event.stopPropagation(); });
    return { show, close, back, host, get context() { return current?.context; } };
  }
  window.NtfsV2 = { createDialog };
})();

</script>

function catOptions(selected){return state.categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${escape(c.name)}${c.name!==statusNames[c.status]?' · '+statusNames[c.status]:''}${state.defaults[c.status]===c.id?' · 默认':''}</option>`).join('')}
function priorityOptions(selected){return priorityNames.slice(1).map((p,i)=>`<option value="${i+1}" ${i+1===selected?'selected':''}>${p}</option>`).join('')}
function detail(id){const t=task(id),personal=!t.project,canDelete=personal||(t.creator==='解鹏'&&category(t.category).status==='todo');open('任务详情',`<form class="mw-form" data-form="detail" data-id="${id}"><p class="mw-info">${personal?'个人任务，仅自己可见，可自由维护。':'项目任务：你是执行人，可调整执行状态与个人分类。'}</p><label>任务名称${personal?`<input name="title" required maxlength="200" value="${escape(t.title)}">`:`<div class="mw-static">${escape(t.title)}</div>`}</label><div class="mw-grid"><label>所属项目<div class="mw-static">${escape(t.project||'无 · 个人任务')}</div></label><label>优先级${personal?`<select name="priority">${priorityOptions(t.priority)}</select>`:`<div class="mw-static">${priorityNames[t.priority]}</div>`}</label><label>执行人<div class="mw-static">解鹏</div></label><label>创建人<div class="mw-static">${escape(t.creator)}</div></label></div>${t.project?`<label>日期区间<div class="mw-static">${escape((t.plan||'').replace(/(\d{4})-(\d{2})-(\d{2})/g,'$1年$2月$3日')||'未设置')}</div></label><label>关联里程碑<div class="mw-static">${escape(t.milestone||'未关联')}</div></label>`:''}<label>个人分类 / 执行状态<select name="category">${catOptions(t.category)}</select></label>${t.completedAt?`<small>实际完成日期：${t.completedAt}</small>`:''}<div class="mw-form-footer">${canDelete?`<button type="button" class="mw-danger" data-action="delete" data-id="${id}">删除任务</button>`:''}<button type="button" data-action="close">取消</button><button class="mw-primary" type="submit">保存</button></div></form>`,true)}
function create(){open('新建任务',`<form class="mw-form" data-form="create"><label>任务名称<input name="title" required maxlength="200" placeholder="接下来要做什么？" autofocus></label><div class="mw-grid"><label>任务类型<select name="kind" id="mw-kind"><option value="personal">个人任务</option><option value="project">项目任务</option></select></label><label>优先级<select name="priority">${priorityOptions(3)}</select></label></div><div id="mw-project-fields" hidden><label>所属项目<select name="project" id="mw-create-project"><option>山东</option><option>济南</option><option>烟台</option></select></label><div class="mw-grid"><label>执行人<div class="mw-static">解鹏 · 本人</div></label><label>创建人<div class="mw-static">解鹏</div></label></div><label>日期区间 · 必填<select name="period" disabled required>${periods.map(p=>`<option value="${p.id}" ${p.id==='current'?'selected':''}>${p.label}</option>`).join('')}</select></label><label>关联里程碑 · 可选<select name="milestone" disabled>${milestoneOptions('山东')}</select></label></div><label>放入分类<select name="category">${catOptions(state.defaults.todo)}</select></label><p class="mw-info" id="mw-create-info">仅自己可见，不进入项目汇总和团队周计划。</p><div class="mw-form-footer"><button type="button" data-action="close">取消</button><button class="mw-primary" type="submit">创建任务</button></div></form>`)}
function addCategory(){open('新增分类',`<form data-form="category" class="mw-form"><label>分类名称<input required name="name" maxlength="30" placeholder="例如：等待联调" autofocus></label><label>对应状态<select name="status"><option value="todo">未开始</option><option value="doing">进行中</option><option value="done">已完成</option></select></label><label class="mw-check"><input type="checkbox" name="default">设为该状态的默认进入分类</label><small>默认分类接收新分配的任务和状态变化；已有任务不会搬动。</small><p class="mw-error" role="alert" id="mw-cat-error"></p><div class="mw-form-footer"><button type="button" data-action="close">取消</button><button class="mw-primary" type="submit">添加分类</button></div></form>`)}
function renameCategory(id){const c=category(id);open('修改分类名称',`<form data-form="rename" data-id="${id}" class="mw-form"><label>分类名称<input required name="name" maxlength="30" value="${escape(c.name)}" autofocus></label><small>对应状态：${statusNames[c.status]}</small><p class="mw-error" role="alert" id="mw-cat-error"></p><div class="mw-form-footer"><button type="button" data-action="close">取消</button><button class="mw-primary" type="submit">保存</button></div></form>`)}
function closeMenus(){root.querySelectorAll('.mw-col-menu[open]').forEach(el=>el.open=false)}
root.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopPropagation();return}
  if(!e.target.closest('.mw-col-menu'))closeMenus();
  const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id;
  switch(b.dataset.action){
    case'close':close();break;
    case'create':create();break;
    case'add-category':addCategory();break;
    case'rename-category':closeMenus();renameCategory(b.dataset.category);break;
    case'default-category':{const c=category(b.dataset.category);state.defaults[c.status]=c.id;update(`“${c.name}”已设为${statusNames[c.status]}的默认进入分类，已有任务保持原位。`);break}
    case'reorder':state.tasks.sort((a,b)=>a.priority-b.priority);update('各分类已按优先级重排，同优先级保留原顺序；之后仍可自由拖动。');break;
    case'detail':detail(id);break;
    case'move':chooseMove(id);break;
    case'advance':chooseMove(id,category(task(id).category).status==='todo'?'doing':'done');break;
    case'reopen':chooseMove(id,'doing');break;
    case'choose':close(true);move(id,b.dataset.category);break;
    case'delete':open('删除任务',`<p>确认删除“${escape(task(id).title)}”？</p><p class="mw-info">${task(id).project?'将删除整条任务及其各区间安排。':'此个人任务将被删除。'}</p><div class="mw-form-footer"><button data-action="back-detail">返回详情</button><button class="mw-danger" data-action="confirm-delete" data-id="${id}">确认删除</button></div>`);break;
    case'back-detail':ui.back();break;
    case'confirm-delete':state.tasks=state.tasks.filter(t=>t.id!==id);close(true);update('任务已删除。');break;
    case'remove-category':{
      const c=category(b.dataset.category),targets=state.categories.filter(x=>x.status===c.status&&x.id!==c.id),isDefault=state.defaults[c.status]===c.id;
      if(!targets.length)return;closeMenus();
      open('删除分类',`<form class="mw-form" data-form="remove-category" data-id="${c.id}"><p>删除“${escape(c.name)}”后，任务会保留。</p><label>将任务移至同状态分类<select name="target">${targets.map(x=>`<option value="${x.id}" ${state.defaults[c.status]===x.id?'selected':''}>${escape(x.name)}</option>`).join('')}</select></label>${isDefault?'<p class="mw-info">所选分类同时接替为该状态的默认进入分类。</p>':''}<div class="mw-form-footer"><button type="button" data-action="close">取消</button><button class="mw-primary" type="submit">移动任务并删除分类</button></div></form>`);break;
    }
  }
});
root.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const values=new FormData(f),id=f.dataset.id;
  switch(f.dataset.form){
    case'detail':{
      const t=task(id),target=String(values.get('category'));
      if(!t.project){const title=String(values.get('title')).trim();if(!title){f.elements.title.setCustomValidity('请输入任务名称');f.elements.title.reportValidity();return}t.title=title;t.priority=Number(values.get('priority'))}
      close(true);if(t.category!==target)move(id,target);else update('任务已保存，顺序保持不变。');break;
    }
    case'create':{
      const title=String(values.get('title')).trim();if(!title){f.elements.title.setCustomValidity('请输入任务名称');f.elements.title.reportValidity();return}
      const cat=String(values.get('category'));
      state.tasks.unshift({id:'task-'+Date.now(),title,project:values.get('kind')==='project'?String(values.get('project')):'',priority:Number(values.get('priority')),category:cat,creator:'解鹏',plan:values.get('kind')==='project'?(()=>{const p=periods.find(p=>p.id===values.get('period'));return p.start+'—'+p.end})():'',milestone:values.get('kind')==='project'?String(values.get('milestone')||''):'',isNew:true,completedAt:category(cat).status==='done'?today:null});
      state.query='';state.filter='all';if(category(cat).status==='done')state.period='current';close(true);update('新任务已置顶，已有任务顺序保持不变。');root.querySelector(`[data-category="${cat}"].mw-column`).scrollIntoView({block:'nearest',inline:'nearest'});break;
    }
    case'category':case'rename':{
      const name=String(values.get('name')).trim();if(!name||state.categories.some(c=>c.name===name&&c.id!==id)){$('#mw-cat-error').textContent='请输入不重复的分类名称。';return}
      let savedId=id;
      if(f.dataset.form==='rename')category(id).name=name;
      else{const status=String(values.get('status'));savedId='cat-'+Date.now();const c={id:savedId,name,status};const last=state.categories.map(x=>x.status).lastIndexOf(status);state.categories.splice(last+1,0,c);if(values.has('default'))state.defaults[status]=savedId}
      close(true);update('分类已保存，已有任务保持原位。');root.querySelector(`[data-category="${savedId}"].mw-column`).scrollIntoView({block:'nearest',inline:'nearest'});break;
    }
    case'remove-category':{
      const target=String(values.get('target')),c=category(id);
      if(state.defaults[c.status]===id)state.defaults[c.status]=target;
      const moving=state.tasks.filter(t=>t.category===id);state.tasks=state.tasks.filter(t=>t.category!==id);moving.forEach(t=>t.category=target);state.tasks.push(...moving);
      state.categories=state.categories.filter(c=>c.id!==id);close(true);update('分类已删除，任务已保留并移至所选分类。');break;
    }
  }
});
// 预览容器禁止原生表单导航，校验后显式触发本地保存逻辑。
function submitLocal(form){if(form?.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}
root.addEventListener('click',e=>{const submit=e.target.closest('button[type="submit"]');if(submit){e.preventDefault();submitLocal(submit.form)}});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();submitLocal(e.target.closest('form'))}});
root.addEventListener('input',e=>{if(e.target.id==='mw-search'){state.query=e.target.value;render();persist()}else if(e.target.name==='title')e.target.setCustomValidity('')});
root.addEventListener('change',e=>{if(e.target.id==='mw-create-project'){$('[name=milestone]').innerHTML=milestoneOptions(e.target.value);}if(e.target.id==='mw-filter'){state.filter=e.target.value;render();persist()}if(e.target.hasAttribute('data-period')){state.period=e.target.value;update('已切换完成日期区间，未完成任务不受影响。')}if(e.target.id==='mw-kind'){const project=e.target.value==='project';$('#mw-project-fields').hidden=!project;$('#mw-project-fields [name=period]').disabled=!project;$('#mw-project-fields [name=milestone]').disabled=!project;$('#mw-create-info').textContent=project?'创建后由你执行，进入所选项目；保存后，安排信息由负责人维护。':'仅自己可见，不进入项目汇总和团队周计划。'}});
// 跟随卡片、真实占位和 FLIP 让位动画共用一个指针循环，移动菜单支持键盘和触屏。
let pointer=null,ghost=null,placeholder=null,dragFrame=0,suppressClick=false,settling=false;
function stopDrag(keepHidden=false){
  cancelAnimationFrame(dragFrame);dragFrame=0;
  if(pointer?.element&&!keepHidden)pointer.element.hidden=false;
  if(pointer&&root.hasPointerCapture(pointer.pointerId))root.releasePointerCapture(pointer.pointerId);
  ghost?.remove();placeholder?.remove();ghost=null;placeholder=null;pointer=null;dragged=null;settling=false;
  root.classList.remove('mw-drag-active');root.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
  root.querySelectorAll('.mw-empty').forEach(el=>el.hidden=false);
}
function beginDrag(){
  const box=pointer.element.getBoundingClientRect();dragged=pointer.id;closeMenus();
  pointer.offsetX=pointer.startX-box.left;pointer.offsetY=pointer.startY-box.top;
  ghost=pointer.element.cloneNode(true);ghost.classList.add('mw-drag-ghost');ghost.removeAttribute('data-id');ghost.setAttribute('aria-hidden','true');ghost.style.width=box.width+'px';root.appendChild(ghost);
  placeholder=document.createElement('div');placeholder.className='mw-placeholder';placeholder.style.height=box.height+'px';placeholder.setAttribute('aria-hidden','true');pointer.element.before(placeholder);pointer.element.hidden=true;
  pointer.target={category:task(dragged).category,before:null};pointer.lastKey='';root.classList.add('mw-drag-active');
  dragFrame=requestAnimationFrame(dragTick);
}
function dragTick(){
  if(!pointer||!dragged||settling)return;
  const box=root.getBoundingClientRect();ghost.style.transform=`translate3d(${pointer.x-box.left-pointer.offsetX}px,${pointer.y-box.top-pointer.offsetY}px,0) rotate(1deg)`;
  const board=$('#mw-board'),boardBox=board.getBoundingClientRect();
  if(pointer.y>=boardBox.top&&pointer.y<=boardBox.bottom){
    const edge=44;let speed=0;if(pointer.x<boardBox.left+edge)speed=-Math.min(14,(boardBox.left+edge-pointer.x)/3);else if(pointer.x>boardBox.right-edge)speed=Math.min(14,(pointer.x-boardBox.right+edge)/3);
    if(speed)board.scrollLeft+=speed;
  }
  if(pointer.y>window.innerHeight-52)window.scrollBy(0,Math.min(12,(pointer.y-window.innerHeight+52)/3));else if(pointer.y<52)window.scrollBy(0,-Math.min(12,(52-pointer.y)/3));
  const hit=document.elementFromPoint(pointer.x,pointer.y),col=hit?.closest('.mw-column');
  root.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
  if(col&&root.contains(col)){
    col.classList.add('over');
    const list=col.querySelector('.mw-card-list'),cards=[...list.querySelectorAll('.mw-task:not([hidden])')];
    // offsetTop 取布局位置，避免让位动画中的临时位移造成落点来回跳动。
    const top=col.getBoundingClientRect().top;
    const target=cards.find(el=>pointer.y<top+el.offsetTop+el.offsetHeight/2);
    const key=col.dataset.category+':'+(target?.dataset.id||'end');
    pointer.target={category:col.dataset.category,before:target?.dataset.id||null};
    if(pointer.lastKey!==key){
      const before=rects();root.querySelectorAll('#mw-board .mw-task').forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
      root.querySelectorAll('.mw-empty').forEach(el=>el.hidden=false);list.querySelectorAll('.mw-empty').forEach(el=>el.hidden=true);
      list.insertBefore(placeholder,target||null);pointer.lastKey=key;animatePositions(before);
    }
  }else pointer.target=null;
  dragFrame=requestAnimationFrame(dragTick);
}
root.addEventListener('dragstart',e=>e.preventDefault());
root.addEventListener('pointerdown',e=>{
  const el=e.target.closest('#mw-board .mw-task');if(!el||e.target.closest('button')||e.button!==0||settling)return;
  pointer={id:el.dataset.id,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,element:el,pointerId:e.pointerId};root.setPointerCapture(e.pointerId);
});
root.addEventListener('pointermove',e=>{if(!pointer||settling)return;pointer.x=e.clientX;pointer.y=e.clientY;if(!dragged&&Math.hypot(pointer.x-pointer.startX,pointer.y-pointer.startY)>6)beginDrag();if(dragged)e.preventDefault()});
root.addEventListener('pointerup',async e=>{
  if(!pointer||settling)return;
  if(!dragged){stopDrag();return}
  pointer.x=e.clientX;pointer.y=e.clientY;cancelAnimationFrame(dragFrame);dragTick();cancelAnimationFrame(dragFrame);
  const id=dragged,target=pointer.target,session=pointer;settling=true;suppressClick=true;
  if(target&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const dest=placeholder.getBoundingClientRect(),base=root.getBoundingClientRect();
    try{await ghost.animate([{transform:ghost.style.transform},{transform:`translate3d(${dest.left-base.left}px,${dest.top-base.top}px,0) rotate(0deg)`}],{duration:140,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished}catch{}
  }
  if(pointer!==session){suppressClick=false;return}
  stopDrag(Boolean(target));if(target)move(id,target.category,target.before,'end');else notice('已取消移动，任务保持原位。');
  setTimeout(()=>{suppressClick=false},0);
});
root.addEventListener('pointercancel',()=>stopDrag());
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&pointer){stopDrag();notice('已取消移动，任务保持原位。')}});
window.addEventListener('blur',()=>{if(pointer)stopDrag()});
window.addEventListener('openai:set_globals',e=>{if(dialog.open)return;if(restore(e.detail?.globals?.widgetState)){stopDrag();if(dialog.open)close(true);render()}});
/** 标语只在打开原型时抽取一次，不随任务操作或问候更新切换。 */
const teamMessages=JSON.parse(root.dataset.teamMessages||'[]').map(message=>message.trim()).filter(Boolean);
const selectedTeamMessage=teamMessages[Math.floor(Math.random()*teamMessages.length)]||'';
function renderGreeting(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const minutes=Number(parts.find(part=>part.type==='hour').value)*60+Number(parts.find(part=>part.type==='minute').value);
  $('#mw-greeting').textContent=(minutes<360||minutes>=1320?'夜深了':minutes<570?'早上好':minutes<720?'上午好':minutes<840?'中午好':minutes<1080?'下午好':'晚上好')+'，解鹏';
  const phrase=$('#mw-team-phrase');
  phrase.textContent=selectedTeamMessage;
  phrase.hidden=!selectedTeamMessage;
}
let greetingTimer;
function updateGreeting(){clearTimeout(greetingTimer);renderGreeting();greetingTimer=setTimeout(updateGreeting,60000-Date.now()%60000)}
window.addEventListener('focus',updateGreeting);
document.addEventListener('visibilitychange',updateGreeting);
updateGreeting();

render();
if(globalThis.Tweak){const design={cardPadding:14};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--mw-pad',design.cardPadding+'px')});tweak.addSlider(design,'cardPadding',{label:'卡片留白',min:10,max:22,unit:'px'})}
})();
</script>
