<script>
/* V2.0 原型共用交互；由 build-v2.py 内联到各维护源及预览，不接入业务接口。 */
(() => {
  /** 在一个原生对话框内切换内容，保留上一步表单、滚动位置和焦点。 */
  function createDialog(root, { restore, exit } = {}) {
    root.classList.add('v2-scope');
    const host = document.createElement('dialog');
    host.className = 'v2-dialog';
    root.append(host);
    let current = null, stack = [], origin = null, pending = null;
    const signature = node => JSON.stringify([...node.querySelectorAll('input,select,textarea')].map(input => [input.name || input.dataset.edit, input.value, input.checked]));
    const dirty = entry => entry && signature(entry.node) !== entry.original;

    function mount(entry) {
      host.replaceChildren(entry.node);
      host.setAttribute('aria-label', entry.title);
      host.classList.toggle('v2-wide', entry.wide);
      entry.node.querySelector('[data-v2-back]').hidden = !stack.length;
      if (!host.open) host.showModal();
      entry.node.querySelector('.v2-content').scrollTop = entry.scroll || 0;
      const focus = entry.focus?.isConnected ? entry.focus : entry.node.querySelector('.v2-content input:not(:disabled),.v2-content select:not(:disabled),.v2-content textarea:not(:disabled)') || entry.node.querySelector('[data-v2-back]:not([hidden]),[data-v2-close]');
      focus?.focus({ preventScroll: true });
    }

    /** 未保存提示占用当前表面，不再增加遮罩；取消保留所有字段。 */
    function guard(action, all = false) {
      if (!dirty(current) && !(all && stack.some(dirty))) { action(); return; }
      pending = action;
      const warning = current.node.querySelector('.v2-unsaved');
      warning.hidden = false;
      warning.querySelector('button').focus();
    }

    function close(force = false) {
      const perform = () => {
        host.close(); host.replaceChildren(); current = null; stack = []; pending = null;
        exit?.();
        if (origin?.isConnected) origin.focus({ preventScroll: true });
        else root.querySelector('main button,button')?.focus({ preventScroll: true });
      };
      if (force) perform(); else guard(perform, true);
    }

    function back(force = false) {
      if (!stack.length) { close(force); return; }
      const perform = () => { current = stack.pop(); mount(current); restore?.(current.context); };
      if (force) perform(); else guard(perform);
    }

    /** 底部操作组居中，依次为关闭、其他操作、保存；右上角保留快捷关闭。 */
    function show({ title, body, actions = '', context = {}, form = false, wide = false, key = '' }) {
      const scroll = current && key && current.key === key ? current.node.querySelector('.v2-content').scrollTop : 0;
      if (!current) origin = document.activeElement;
      else if (!key || key !== current.key) {
        current.scroll = current.node.querySelector('.v2-content').scrollTop;
        current.focus = document.activeElement;
        stack.push(current);
      }
      const node = document.createElement('section');
      node.className = 'v2-dialog-layout';
      node.innerHTML = `<header class="v2-dialog-header"><button type="button" data-v2-back aria-label="返回上一步">← 返回</button><h2></h2><button type="button" data-v2-close aria-label="关闭弹窗" class="v2-close">×</button></header><div class="v2-unsaved" role="alert" hidden><span>有未保存的修改，是否放弃？</span><button type="button" data-v2-keep>继续编辑</button><button type="button" data-v2-discard class="v2-danger">放弃修改</button></div><div class="v2-content"></div><footer class="v2-dialog-footer"><div class="v2-actions v2-footer-actions"><button type="button" data-v2-close>关闭</button></div></footer>`;
      node.querySelector('h2').textContent = title;
      const content = node.querySelector('.v2-content');
      content.innerHTML = form ? `<form data-dialog-form>${body}</form>` : body;
      const source = document.createElement('div'); source.innerHTML = actions;
      // 操作区独立于内容滚动，表单外的保存按钮通过 form 属性继续提交。
      const localActions = content.querySelector('.mw-form-footer');
      if (localActions) { source.append(...localActions.childNodes); localActions.remove(); }
      const formNode = content.querySelector('form');
      if (formNode) formNode.id = root.id + '-v2-form';
      const controls = node.querySelector('.v2-footer-actions');
      const secondary = [], primary = [];
      for (const button of [...source.querySelectorAll('button')]) {
        if (/^(取消|关闭|返回详情|返回任务)$/.test(button.textContent.trim()) || ['cancelDelete','returnMilestone','back-task'].includes(button.dataset.action)) { button.remove(); continue; }
        if (button.type === 'submit' && formNode) button.setAttribute('form', formNode.id);
        if (/删除/.test(button.textContent)) button.classList.add('v2-danger');
        const commits = button.type === 'submit' || button.matches('.nt-primary,.mw-primary,.primary') || /^(保存|确认|加入安排)/.test(button.textContent.trim());
        (commits ? primary : secondary).push(button);
      }
      controls.append(...secondary, ...primary);
      const note = source.textContent.trim();
      if (note) { const info = document.createElement('p'); info.className = 'v2-context'; info.textContent = note; content.prepend(info); }
      current = { title, node, context, wide, key, scroll, original: signature(node) };
      mount(current);
    }

    host.addEventListener('click', event => {
      if (event.target.closest('[data-v2-close]')) close();
      if (event.target.closest('[data-v2-back]')) back();
      if (event.target.closest('[data-v2-keep]')) { current.node.querySelector('.v2-unsaved').hidden = true; pending = null; current.node.querySelector('.v2-content input,.v2-content select,.v2-content textarea')?.focus(); }
      if (event.target.closest('[data-v2-discard]')) { const action = pending; pending = null; action?.(); }
    });
    host.addEventListener('cancel', event => { event.preventDefault(); stack.length ? back() : close(); });
    // 原生 dialog 负责焦点围栏与背景 inert；屏蔽旧页面的 Escape 处理器。
    host.addEventListener('keydown', event => { if (event.key === 'Escape') event.stopPropagation(); });
    return { show, close, back, host, get context() { return current?.context; } };
  }
  window.NtfsV2 = { createDialog };
})();

</script>

<script>
(() => {

  const app = root.querySelector('.w-app');
  // 示例选取用户模板中的单负责人事项；不接入业务接口。
  const projects = [
    {id:'sd',name:'山东'}, {id:'jn',name:'济南'}, {id:'yt',name:'烟台'}, {id:'expert',name:'数字专家'}
  ];
  const milestones={sd:['平台稳定性优化','统一身份对接'],jn:['云资源交付优化'],yt:['验收流程优化'],expert:['评审能力交付']};
  function milestoneOptions(project,value=''){return '<option value="">不关联</option>'+milestones[project].map(m=>`<option ${m===value?'selected':''}>${escape(m)}</option>`).join('');}
  const people = ['解鹏','蔡祥龙','耿龙凤','任仰铭','张璐璐','陶雅楠','法坤'];
  const periods = [
    {id:'p0',start:'2026-10-05',end:'2026-10-11'},
    {id:'p1',start:'2026-10-12',end:'2026-10-18'},
    {id:'p2',start:'2026-10-19',end:'2026-10-25'},
    {id:'p3',start:'2026-10-26',end:'2026-11-01'},
    {id:'p4',start:'2026-11-02',end:'2026-11-08'}
  ];
  const tasks = [
    {id:'t1',project:'sd',title:'山东通部门与用户对接',person:'解鹏',status:'进行中',priority:2},
    {id:'t2',project:'sd',title:'处理 kafka 消费异常与地市消息积压',person:'解鹏',status:'已完成',priority:1},
    {id:'t3',project:'sd',title:'项目档案接口开发',person:'蔡祥龙',status:'已完成',priority:2},
    {id:'t4',project:'sd',title:'统建功能主分支适配生产环境更新',person:'解鹏',status:'未开始',priority:2},
    {id:'t5',project:'sd',title:'同域配合生产测试',person:'蔡祥龙',status:'未开始',priority:3},
    {id:'t6',project:'sd',title:'系统库相关接口修改',person:'蔡祥龙',status:'未开始',priority:3},
    {id:'t7',project:'jn',title:'云资源流程修改',person:'任仰铭',status:'已完成',priority:2},
    {id:'t8',project:'jn',title:'云资源交付导入模板合并',person:'张璐璐',status:'已完成',priority:3},
    {id:'t9',project:'jn',title:'新增资源添加复制功能',person:'陶雅楠',status:'已完成',priority:3},
    {id:'t10',project:'jn',title:'认领区接口重构',person:'任仰铭',status:'未开始',priority:2},
    {id:'t11',project:'jn',title:'认领区页面重构',person:'陶雅楠',status:'未开始',priority:2},
    {id:'t12',project:'yt',title:'集中运维申报增加撤回',person:'张璐璐',status:'进行中',priority:2},
    {id:'t13',project:'yt',title:'历史备案项目验收表单修改',person:'张璐璐',status:'进行中',priority:3},
    {id:'t14',project:'yt',title:'四张清单接口对接',person:'任仰铭',status:'未开始',priority:2},
    {id:'t15',project:'yt',title:'四张清单跳转入口',person:'张璐璐',status:'未开始',priority:3},
    {id:'t16',project:'expert',title:'预审智能体规则生成',person:'法坤',status:'未开始',priority:2},
    {id:'t17',project:'sd',title:'项目档案页面联调',person:'耿龙凤',status:'未开始',priority:3}
  ];
  tasks.forEach(t=>{t.creator='解鹏';t.milestone='';});
  // 顺序归属于项目与日期区间，同一任务跨区间时独立安排投入。
  const arrangements = [
    {task:'t17',period:'p0',days:null,outside:false},{task:'t1',period:'p1',days:2,outside:false},{task:'t2',period:'p1',days:1,outside:true},{task:'t3',period:'p1',days:3,outside:false},
    {task:'t7',period:'p1',days:2,outside:false},{task:'t8',period:'p1',days:2,outside:false},{task:'t9',period:'p1',days:2,outside:false},
    {task:'t12',period:'p1',days:2,outside:false},{task:'t13',period:'p1',days:null,outside:true},
    {task:'t4',period:'p2',days:2,outside:false},{task:'t5',period:'p2',days:2,outside:false},{task:'t6',period:'p2',days:1,outside:false},
    {task:'t10',period:'p2',days:3,outside:false},{task:'t11',period:'p2',days:3,outside:false},
    {task:'t14',period:'p2',days:2,outside:false},{task:'t15',period:'p2',days:null,outside:false},
    {task:'t16',period:'p2',days:4,outside:false}
  ];
  const state={summaryPeriod:'p1',planPeriod:'p2',project:'all',group:'project',textOpen:false};
  const reports=new Map();
  const design={rowSpace:12,columnGap:28};
  let message='示例数据 · 拖动把手调整顺序，点击任务名称编辑';
  let dialog=null, sequence=30, drag=null;
  const ui=NtfsV2.createDialog(root,{restore:context=>{dialog=context;},exit:()=>{dialog=null;}});
  let sortingProjects=false;

  /** 转义示例内所有可编辑文字，避免把输入作为页面结构。 */
  function escape(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
  function icon(name){return `<i data-lucide="${name}" aria-hidden="true"></i>`;}
  function button(label,action,attributes='',style=''){return `<button type="button" class="w-button cursor-interaction ${style}" data-action="${action}" ${attributes}>${label}</button>`;}
  function dateLabel(date){const [y,m,d]=date.split('-');return `${y}年${Number(m)}月${Number(d)}日`;}
  function rangeLabel(id){const p=periods.find(p=>p.id===id);return p?`${dateLabel(p.start)}—${dateLabel(p.end)}`:'';}
  function projectName(id){return projects.find(p=>p.id===id)?.name||'';}
  function periodOptions(id){return periods.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${rangeLabel(p.id)}</option>`).join('');}
  function personOptions(person){return ['',...people].map(p=>`<option value="${p}" ${p===person?'selected':''}>${p||'请选择执行人'}</option>`).join('');}
  function visibleProjects(){return projects.filter(p=>state.project==='all'||p.id===state.project);}
  function entries(period,project){return arrangements.filter(a=>a.period===period).map(a=>({...a,record:tasks.find(t=>t.id===a.task)})).filter(a=>a.record&&(!project||a.record.project===project));}
  function badge(status){return `<span class="w-tag ${status==='已完成'?'done':status==='进行中'?'doing':''}">${status}</span>`;}
  function priorityLabel(priority){return `${priority} ${['','最高','高','中','低','最低'][priority]}`;}
  function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
  function announce(text){message=text;const el=root.querySelector('[data-status]');if(el)el.textContent=text;}

  /** 日期按维护后的区间顺序双向联动；到边界时补齐相邻自然长度区间。 */
  function shiftDate(date,days){const value=new Date(date+'T12:00:00Z');value.setUTCDate(value.getUTCDate()+days);return value.toISOString().slice(0,10);}
  function linkPeriods(control,id){
    const selected=periods.find(p=>p.id===id);if(!selected)return;
    let index=periods.indexOf(selected);
    if(control==='summaryPeriod'){
      if(index===periods.length-1)periods.push({id:'p-next-'+(++sequence),start:shiftDate(selected.end,1),end:shiftDate(selected.end,7)});
      state.summaryPeriod=id;state.planPeriod=periods[index+1].id;
    }else{
      if(index===0){periods.unshift({id:'p-prev-'+(++sequence),start:shiftDate(selected.start,-7),end:shiftDate(selected.start,-1)});index=1;}
      state.planPeriod=id;state.summaryPeriod=periods[index-1].id;
    }
  }

  /** 生成两区间全项目文字；每条任务只有一个负责人，编号在项目内重置。 */
  function generatedReport(){
    return [state.summaryPeriod,state.planPeriod].map(period=>{
      const sections=projects.map(project=>{
        const rows=entries(period,project.id);
        return rows.length?project.name+'\n'+rows.map((a,i)=>`${i+1}.${a.record.title} ${a.record.person||'待分配'}`).join('\n'):'';
      }).filter(Boolean);
      return rangeLabel(period)+'\n'+(sections.length?sections.join('\n'):'暂无任务');
    }).join('\n\n');
  }
  /** 来源签名包含关联任务、状态、投入和顺序，筛选视角不会影响文字版本。 */
  function sourceSignature(){
    return JSON.stringify([state.summaryPeriod,state.planPeriod].map(period=>({date:rangeLabel(period),projects:projects.map(p=>({id:p.id,name:p.name,rows:entries(period,p.id).map(a=>({id:a.task,title:a.record.title,person:a.record.person,status:a.record.status,priority:a.record.priority,days:a.days,outside:a.outside}))})).filter(p=>p.rows.length)})));
  }
  function reportKey(){return state.summaryPeriod+':'+state.planPeriod;}
  function currentReport(){
    const key=reportKey();
    if(!reports.has(key))reports.set(key,{value:generatedReport(),manual:false,baseline:sourceSignature(),draft:null,draftBaseline:null,preview:null,copyStatus:''});
    const report=reports.get(key);
    if(!report.manual&&report.draft===null){report.value=generatedReport();report.baseline=sourceSignature();}
    return report;
  }
  function isStale(report){return report.manual&&report.baseline!==sourceSignature();}
  function reportPanel(){
    if(!state.textOpen)return '';
    const report=currentReport(),stale=isStale(report);
    const controls=report.draft!==null?`${button('取消编辑','cancel-report')}${button('保存文字','save-report','','primary')}`:`${button(icon('pencil')+' 编辑','edit-report')}${report.manual?button('重新生成','preview-report'):''}${button(icon('copy')+' 一键复制','copy-report','','primary')}`;
    return `<section class="w-report" aria-label="文字版"><header class="w-report-head"><div><h2>文字版</h2><span class="w-small w-muted">全部项目 · ${report.manual?'已手工编辑':'随任务自动更新'}</span></div><div class="w-row">${controls}</div></header>
      ${stale?`<div class="w-report-notice" role="status"><span>任务安排有更新，文字版尚未同步。已保留你的文字。</span>${report.draft===null?button('我已核对，保留当前文字','reviewed-report'):''}</div>`:''}
      ${report.draft!==null?`<label class="w-field">编辑文字<textarea data-report-editor rows="15" maxlength="12000">${escape(report.draft)}</textarea></label>`:`<pre class="w-report-copy" data-report-value>${escape(report.value)}</pre>`}
      ${report.preview?`<section class="w-regenerate"><div class="w-row w-between"><h3>重新生成预览</h3><div class="w-row">${button('保留原文','cancel-preview')}${button('确认替换','replace-report','','primary')}</div></div><pre class="w-report-copy" data-report-preview>${escape(report.preview.value)}</pre><div class="w-row w-between"><span class="w-small w-muted">确认替换会覆盖手工文字，并恢复自动更新。</span></div></section>`:''}
      <div class="w-row w-between w-report-footer"><span data-copy-status role="status" class="w-small w-muted">${escape(report.copyStatus)}</span></div></section>`;
  }

  /** 把手支持指针拖拽与上下方向键，任务只可在同项目、同区间内排序。 */
  function handle(kind,id,scope,label){return `<button type="button" class="w-drag" data-drag-kind="${kind}" data-drag-id="${id}" data-drag-scope="${scope}" aria-label="拖动排序：${escape(label)}；也可用上下方向键">${icon('grip-vertical')}</button>`;}
  function taskRow(a,period,summary,personView=false){
    const task=a.record;
    return `<div class="w-task-row" data-sort-kind="task" data-sort-id="${task.id}" data-sort-scope="${task.project}:${period}${personView?':'+task.person:''}">
      ${handle('task',task.id,task.project+':'+period+(personView?':'+task.person:''),task.title)}
      <div class="w-task-info"><button type="button" class="w-task-title cursor-interaction" data-action="task" data-id="${task.id}" data-period="${period}">${escape(task.title)}</button><div class="w-task-meta">${badge(task.status)}${summary?(a.outside?'<span class="w-tag outside">计划外</span>':''):`<span>${priorityLabel(task.priority)}</span>`}</div></div>
      ${!personView?`<span class="w-task-person">${escape(task.person||'待分配')}</span>`:''}${summary?'':`<span class="w-task-days">${a.days===null?'未估算':a.days+' 天'}</span>`}</div>`;
  }
  function summaryPanel(project){
    const rows=entries(state.summaryPeriod,project.id);
    return `<div class="w-column" data-part="summary"><span class="w-column-date">总结 · ${rangeLabel(state.summaryPeriod)}</span><div class="w-column-head"><h3>任务完成情况</h3><span class="w-small w-muted">${rows.length} 项</span></div><p class="w-facts">已完成 ${rows.filter(a=>a.record.status==='已完成').length} 项 · 进行中 ${rows.filter(a=>a.record.status==='进行中').length} 项</p>${rows.map(a=>taskRow(a,state.summaryPeriod,true)).join('')||'<div class="w-empty">该区间暂无任务记录</div>'}</div>`;
  }
  function planPanel(project){
    const rows=entries(state.planPeriod,project.id),unknown=rows.filter(a=>a.days===null).length;
    return `<div class="w-column" data-part="plan"><span class="w-column-date">安排 · ${rangeLabel(state.planPeriod)}</span><div class="w-column-head"><h3>任务安排</h3><span class="w-small w-muted">${rows.length} 项 · ${rows.reduce((sum,a)=>sum+(a.days??0),0)} 天${unknown?`＋${unknown} 项未估算`:''}</span></div><div class="w-plan-actions">${button('选择已有任务','existing',`data-project="${project.id}"`)}${button('＋ 批量新增','batch',`data-project="${project.id}"`,'primary')}</div><div class="w-task-list">${rows.map(a=>taskRow(a,state.planPeriod,false)).join('')||'<div class="w-empty">暂无安排，可选择已有任务或批量新增</div>'}</div></div>`;
  }
  function projectPanel(project){
    if(sortingProjects)return `<section class="w-project is-sorting" data-sort-kind="project" data-sort-id="${project.id}" data-sort-scope="projects"><button type="button" class="w-project-sort-handle" data-drag-kind="project" data-drag-id="${project.id}" data-drag-scope="projects" aria-label="拖动排序：${project.name}；也可用上下方向键">${icon('grip-vertical')}<span>${project.name}</span><small>按住整行拖动</small></button></section>`;
    return `<section class="w-project" data-sort-kind="project" data-sort-id="${project.id}" data-sort-scope="projects"><header class="w-project-head"><div class="w-row">${handle('project',project.id,'projects',project.name)}<h2>${project.name}</h2></div></header><div class="w-columns">${summaryPanel(project)}${planPanel(project)}</div></section>`;
  }
  function peoplePanel(){
    const prior=entries(state.summaryPeriod).filter(a=>state.project==='all'||a.record.project===state.project);
    const next=entries(state.planPeriod).filter(a=>state.project==='all'||a.record.project===state.project);
    const members=[...people,''].filter(person=>[...prior,...next].some(a=>a.record.person===person));
    function grouped(rows,period,summary){return visibleProjects().map(p=>{
      const selected=rows.filter(a=>a.record.project===p.id);
      return selected.length?`<h3 class="w-person-project">${p.name}</h3>${selected.map(a=>taskRow(a,period,summary,true)).join('')}`:'';
    }).join('')||'<div class="w-empty">该区间暂无任务</div>';}
    return members.map(person=>{
      const left=prior.filter(a=>a.record.person===person),right=next.filter(a=>a.record.person===person),unknown=right.filter(a=>a.days===null).length;
      return `<section class="w-project"><header class="w-person-head"><div class="w-row"><span class="w-avatar">${person?person.slice(0,1):'待'}</span><h2>${person||'待分配'}</h2></div></header><div class="w-columns"><div class="w-column" data-part="summary"><span class="w-column-date">总结 · ${rangeLabel(state.summaryPeriod)}</span><h3>任务完成情况</h3><p class="w-person-totals">已完成 ${left.filter(a=>a.record.status==='已完成').length} 项 · 进行中 ${left.filter(a=>a.record.status==='进行中').length} 项</p>${grouped(left,state.summaryPeriod,true)}</div><div class="w-column" data-part="plan"><span class="w-column-date">安排 · ${rangeLabel(state.planPeriod)}</span><h3>任务安排</h3><p class="w-person-totals">${right.length} 项 · 已估算 <strong>${right.reduce((sum,a)=>sum+(a.days??0),0)}</strong> 天${unknown?` · 另有 ${unknown} 项未估算`:''}</p>${grouped(right,state.planPeriod,false)}</div></div></section>`;
    }).join('')||'<div class="w-empty">所选的两个区间暂无人员安排</div>';
  }

  /** 只记住查看选择，不将模拟任务或报告写入真实系统。 */
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view:state.group==='project'?'按项目':'按人员',summaryInterval:rangeLabel(state.summaryPeriod),planInterval:rangeLabel(state.planPeriod),textOpen:state.textOpen},privateContent:{...state}}).catch(()=>{});}
  function restore(saved){const value=saved?.privateContent;if(!value||typeof value!=='object')return;
    if(periods.some(p=>p.id===value.summaryPeriod))linkPeriods('summaryPeriod',value.summaryPeriod);
    if(['project','people'].includes(value.group))state.group=value.group;
    if(value.project==='all'||projects.some(p=>p.id===value.project))state.project=value.project;
    if(typeof value.textOpen==='boolean')state.textOpen=value.textOpen;
  }
  function render(){
    const report=currentReport(),stale=isStale(report);
    app.style.setProperty('--w-row-space',design.rowSpace+'px');app.style.setProperty('--w-column-gap',design.columnGap+'px');
    app.innerHTML=`<div class="w-shell"><aside class="w-side"><div class="w-brand"><span class="w-mark"></span><span>下次一定</span></div><nav aria-label="主导航"><span class="w-nav">${icon('square-check-big')}我的工作</span><span class="w-nav is-current" aria-current="page">${icon('calendar-days')}周报与周计划</span><span class="w-nav">${icon('folder-open')}项目</span><span class="w-nav">${icon('users-round')}团队管理</span></nav><div class="w-account"><span class="w-avatar">解</span><span>解鹏<br><span class="w-small w-muted">团队负责人</span></span></div></aside>
    <div class="w-body"><div class="w-topbar"><span>工作空间</span><span>/</span><span>周报与周计划</span><span class="w-demo">交互示例</span></div><main class="w-main"><header class="w-heading"><div><h1>周报与周计划</h1><p class="w-subtitle">按项目回顾工作，协调每个人的安排。</p></div><div class="w-row">${button(icon('file-text')+(state.textOpen?' 收起文字版':' 文字版')+(stale?' · 待同步':''),'toggle-report',`aria-expanded="${state.textOpen}"`,'primary')}${button(icon('calendar-range')+' 日期区间','periods')}</div></header>
    <div class="w-toolbar"><div class="w-row"><div class="w-segment" role="group" aria-label="查看视角"><button type="button" class="cursor-interaction" data-action="group" data-value="project" aria-pressed="${state.group==='project'}">${icon('folder-open')}按项目</button><button type="button" class="cursor-interaction" data-action="group" data-value="people" aria-pressed="${state.group==='people'}">${icon('users-round')}按人员</button></div>${state.group==='project'?button(sortingProjects?'完成排序':'项目排序','sort-projects',`aria-pressed="${sortingProjects}"`,sortingProjects?'primary':''):''}</div><label class="w-filter"><select data-control="project" aria-label="筛选项目" ${sortingProjects?'disabled':''}><option value="all">全部项目</option>${projects.map(p=>`<option value="${p.id}" ${p.id===state.project?'selected':''}>${p.name}</option>`).join('')}</select></label></div>
    <div class="w-status" data-status role="status" aria-live="polite">${escape(message)}</div><div class="w-periods"><label class="w-field">工作总结 · 总结区间<select data-control="summaryPeriod" aria-label="总结区间">${periodOptions(state.summaryPeriod)}</select></label><label class="w-field">工作安排 · 计划区间<select data-control="planPeriod" aria-label="计划区间">${periodOptions(state.planPeriod)}</select></label></div><div data-report-slot>${reportPanel()}</div><div data-content>${state.group==='people'?peoplePanel():visibleProjects().map(projectPanel).join('')}</div><p class="w-foot">项目左右同步排序；任务仅在同项目、同区间内排序。拖拽把手也支持上下方向键。</p></main></div></div>`;
    icons();
  }
  function updateReport(focus){root.querySelector('[data-report-slot]').innerHTML=reportPanel();icons();if(focus)root.querySelector(focus)?.focus();}

  /** 对话框负责当前操作，关闭后尽量恢复到原来的任务入口。 */
  function showDialog(title,body,footer,kind,context={}){
    dialog={kind,...context};
    ui.show({title,body:body+'<p class="w-error" role="alert" data-error></p>',actions:footer,context:dialog,wide:kind==='batch',key:kind+':'+(context.task?.id||context.project||'')});icons();
  }
  function closeDialog(force=false){ui.close(force);}
  function finish(text){closeDialog(true);message=text;render();remember();}
  function error(text){root.querySelector('[data-error]').textContent=text;}
  function parseDays(raw){if(raw==='')return null;const value=Number(raw);return Number.isFinite(value)&&value>0?value:undefined;}
  function openExisting(project){
    const available=tasks.filter(t=>t.project===project&&t.status!=='已完成'&&!arrangements.some(a=>a.task===t.id&&a.period===state.planPeriod));
    showDialog('选择已有任务',`<p class="w-small w-muted">${projectName(project)} · ${rangeLabel(state.planPeriod)}</p><div>${available.map(t=>`<label class="w-choice"><input type="checkbox" value="${t.id}" data-candidate><span>${escape(t.title)}<span class="w-task-meta">${badge(t.status)} ${t.person||'待分配'}</span></span></label>`).join('')||'<div class="w-empty">可安排任务已全部加入</div>'}</div>`,`<span class="w-small w-muted">新加入区间的预计天数留空</span>${button('加入安排','save-existing',available.length?'':'disabled','primary')}`,'existing',{project});
  }
  /** 核心字段与项目入口一致；预计天数只属于当前区间安排。 */
  function batchRow(project){return `<section class="w-batch-row"><div class="v2-section-head w-full"><h3>任务信息</h3>${button('移除此行','remove-row')}</div><label class="w-field w-full">任务名称 · 必填<input data-batch-title maxlength="200" required placeholder="输入任务名称"></label><label class="w-field">执行人 · 必填<select data-batch-person required>${personOptions('')}</select></label><label class="w-field">优先级<select data-batch-priority>${[1,2,3,4,5].map(p=>`<option value="${p}" ${p===3?'selected':''}>${priorityLabel(p)}</option>`).join('')}</select></label><label class="w-field w-full">日期区间 · 必填<select data-batch-period>${periodOptions(state.planPeriod)}</select></label><label class="w-field">关联里程碑 · 可选<select data-batch-milestone>${milestoneOptions(project)}</select></label><label class="w-field">该区间预计天数 · 可选<input data-batch-days type="number" min="0.5" step="0.5" placeholder="未估算"></label></section>`;}
  function openBatch(project){showDialog('批量新增任务',`<p class="w-small w-muted">${projectName(project)}</p><div class="v2-section-head"><h3>录入任务</h3>${button('＋ 添加一行','add-row')}</div><div data-batch-rows>${batchRow(project)}</div>`,`<span class="w-small w-muted">创建人 解鹏 · 预计天数仅作用于对应区间</span>${button('保存全部','save-batch','','primary')}`,'batch',{project});}
  function openTask(id,period){
    const task=tasks.find(t=>t.id===id),arrangement=arrangements.find(a=>a.task===id&&a.period===period);if(!task||!arrangement)return;
    const count=arrangements.filter(a=>a.task===id).length;
    showDialog('编辑任务',`<p class="w-small w-muted">${projectName(task.project)} · 创建人 ${task.creator}</p><div class="w-form-grid"><label class="w-field w-full">任务名称 · 必填<input data-edit="title" required maxlength="200" value="${escape(task.title)}"></label><label class="w-field">执行人 · 必填<select data-edit="person" required>${personOptions(task.person)}</select></label><label class="w-field">优先级<select data-edit="priority">${[1,2,3,4,5].map(p=>`<option value="${p}" ${task.priority===p?'selected':''}>${priorityLabel(p)}</option>`).join('')}</select></label><label class="w-field w-full">当前安排区间<select data-edit="period">${periodOptions(period)}</select><span>调整当前安排，其他区间保持不变</span></label><label class="w-field">关联里程碑 · 可选<select data-edit="milestone">${milestoneOptions(task.project,task.milestone)}</select></label><label class="w-field">执行状态<select data-edit="status">${['未开始','进行中','已完成'].map(s=>`<option ${s===task.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="w-field">该区间预计天数 · 可选<input data-edit="days" type="number" min="0.5" step="0.5" value="${arrangement.days??''}" placeholder="未估算"></label></div><p class="w-small w-muted" style="margin-top:16px">${count===1?'此任务仅有一个区间安排；最后一个安排的取消规则尚待确认，原型暂不开放取消。':'取消安排仅解除当前区间，任务和其他区间保留。'}</p>`,`${button('删除任务','delete-task','','w-danger')}${button('取消该区间安排','remove-arrangement',count===1?'disabled':'')}${button('保存修改','save-task','','primary')}`,'task',{task,arrangement});
  }
  function confirmDelete(){const {task,arrangement}=dialog;showDialog('确认删除任务',`<h3>${escape(task.title)}</h3><p class="w-small w-muted">将删除整条任务及以下区间的安排：</p><ul>${arrangements.filter(a=>a.task===task.id).map(a=>`<li>${rangeLabel(a.period)}</li>`).join('')}</ul><p class="w-small w-muted">已手工编辑的文字会保留，并提示任务有更新。</p>`,`<span class="w-small w-muted">仅删除模拟数据</span><div class="w-row">${button('返回任务','back-task')}${button('确认删除任务','confirm-delete','','w-danger')}</div>`,'delete',{task,period:arrangement.period});}
  function openPeriods(){showDialog('团队日期区间',`<p class="w-small w-muted">自然周自动生成。相邻区间需连续、不重叠。</p>${periods.map(p=>`<div class="w-period-editor" data-period-id="${p.id}"><label class="w-field">开始日期<input data-date="start" type="date" value="${p.start}"></label><label class="w-field">结束日期<input data-date="end" type="date" value="${p.end}"></label></div>`).join('')}`,`<span class="w-small w-muted">联动按区间顺序，不固定加减七天</span>${button('保存区间','save-periods','','primary')}`,'periods');}

  /** 复制成功才显示成功；剪贴板不可用时选中文字并提示快捷键。 */
  async function copyReport(){
    const report=currentReport(),text=report.value;
    let copied=false;
    try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);copied=true;}}catch{}
    if(!copied){
      const field=document.createElement('textarea');field.value=text;field.className='w-copy-helper';field.setAttribute('aria-label','复制文字');app.appendChild(field);field.focus();field.select();
      try{copied=document.execCommand('copy');}catch{}
      field.remove();
    }
    report.copyStatus=copied?(isStale(report)?'已复制当前保留的文字；尚未同步任务更新。':'已复制文字。'):'无法自动复制，已选中文字，请按 Ctrl+C（Mac 使用 ⌘C）。';
    updateReport();
    if(!copied){const content=root.querySelector('[data-report-value]'),selection=window.getSelection();if(content&&selection){const range=document.createRange();range.selectNodeContents(content);selection.removeAllRanges();selection.addRange(range);}}
  }

  // 文本状态与任务操作共用来源签名，删除、排序、改负责人和改日期都触发同步提示。
  root.addEventListener('click',event=>{
    const target=event.target.closest('[data-action]');if(!target)return;
    const action=target.dataset.action;
    if(action==='toggle-report'){state.textOpen=!state.textOpen;render();remember();return;}
    if(['edit-report','cancel-report','save-report','preview-report','cancel-preview','replace-report','reviewed-report','copy-report'].includes(action)){
      const report=currentReport();
      if(action==='copy-report'){void copyReport();return;}
      if(action==='edit-report'){report.draft=report.value;report.draftBaseline=report.baseline;report.preview=null;report.copyStatus='';}
      if(action==='cancel-report'){report.draft=null;report.draftBaseline=null;}
      if(action==='save-report'){
        const value=root.querySelector('[data-report-editor]').value;
        if(value!==report.value){report.manual=true;report.value=value;report.baseline=report.draftBaseline;}
        report.draft=null;report.draftBaseline=null;report.copyStatus='文字已保存。';
      }
      if(action==='preview-report')report.preview={value:generatedReport(),baseline:sourceSignature()};
      if(action==='cancel-preview')report.preview=null;
      if(action==='replace-report'){
        if(!report.preview)return;
        if(report.preview.baseline!==sourceSignature()){report.preview={value:generatedReport(),baseline:sourceSignature()};report.copyStatus='预览后任务又有变化，已更新预览，请再次确认。';updateReport();return;}
        report.value=report.preview.value;report.baseline=report.preview.baseline;report.manual=false;report.preview=null;report.copyStatus='已替换，恢复自动更新。';
      }
      if(action==='reviewed-report'){report.baseline=sourceSignature();report.copyStatus='已确认保留当前文字。';}
      render();if(action==='edit-report')root.querySelector('[data-report-editor]').focus();remember();return;
    }
    if(action==='sort-projects'){sortingProjects=!sortingProjects;if(sortingProjects){state.project='all';state.textOpen=false;}message=sortingProjects?'按住项目整行拖动，调整后点击“完成排序”。':'项目顺序已应用到两栏。';render();root.querySelector('[data-action="sort-projects"]')?.focus();return;}
    if(action==='group'){sortingProjects=false;state.group=target.dataset.value;render();remember();return;}
    if(action==='task'){openTask(target.dataset.id,target.dataset.period);return;}
    if(action==='existing'){openExisting(target.dataset.project);return;}
    if(action==='batch'){openBatch(target.dataset.project);return;}
    if(action==='periods'){openPeriods();return;}
    if(action==='close'){closeDialog();return;}
    if(!dialog)return;
    if(action==='delete-task'){confirmDelete();return;}
    if(action==='back-task'){ui.back();return;}
    if(action==='confirm-delete'){const id=dialog.task.id;for(let i=arrangements.length-1;i>=0;i--)if(arrangements[i].task===id)arrangements.splice(i,1);tasks.splice(tasks.findIndex(t=>t.id===id),1);finish('已删除模拟任务及各区间安排。');return;}
    if(action==='remove-arrangement'){const {task,arrangement}=dialog;if(arrangements.filter(a=>a.task===task.id).length<2){error('最后一个区间安排暂不可取消。');return;}showDialog('取消该区间安排',`<p>${escape(task.title)}</p><p>${rangeLabel(arrangement.period)}</p><p>仅取消此区间，任务及其他区间保留；未保存的修改不会写入。</p>`,button('确认取消安排','confirm-remove','','w-danger'),'remove',{task,arrangement});return;}
    if(action==='confirm-remove'){arrangements.splice(arrangements.indexOf(dialog.arrangement),1);finish('已取消该区间安排，任务和其他区间保留。');return;}
    if(action==='save-task'){
      const read=name=>root.querySelector(`[data-edit="${name}"]`).value,title=read('title').trim(),days=parseDays(read('days'));
      if(!title||!read('person')||days===undefined){error('请填写任务名称和执行人，预计天数需大于 0 或留空。');return;}
      if(arrangements.some(a=>a!==dialog.arrangement&&a.task===dialog.task.id&&a.period===read('period'))){error('该任务已在目标区间安排，请直接编辑已有安排。');return;}
      Object.assign(dialog.task,{title,person:read('person'),status:read('status'),priority:Number(read('priority')),milestone:read('milestone')});dialog.arrangement.days=days;dialog.arrangement.period=read('period');finish('任务已更新，项目与人员视角同步。');return;
    }
    if(action==='save-existing'){
      const selected=Array.from(root.querySelectorAll('[data-candidate]:checked')).map(input=>input.value);
      if(!selected.length){error('请选择至少一条任务。');return;}
      selected.forEach(task=>arrangements.push({task,period:state.planPeriod,days:null,outside:false}));finish(`已加入 ${selected.length} 项任务，预计天数尚未填写。`);return;
    }
    if(action==='add-row'){const rows=root.querySelector('[data-batch-rows]');if(rows.children.length>=5){error('示例一次最多录入 5 行。');return;}rows.insertAdjacentHTML('beforeend',batchRow(dialog.project));rows.lastElementChild.querySelector('input').focus();return;}
    if(action==='remove-row'){const rows=root.querySelector('[data-batch-rows]');if(rows.children.length===1){error('至少保留一行，或关闭窗口。');return;}target.closest('.w-batch-row').remove();return;}
    if(action==='save-batch'){
      const rows=Array.from(root.querySelectorAll('.w-batch-row')).map(row=>({title:row.querySelector('[data-batch-title]').value.trim(),person:row.querySelector('[data-batch-person]').value,days:parseDays(row.querySelector('[data-batch-days]').value),priority:Number(row.querySelector('[data-batch-priority]').value),period:row.querySelector('[data-batch-period]').value,milestone:row.querySelector('[data-batch-milestone]').value}));
      if(!rows.length||rows.some(row=>!row.title||!row.person||!row.period||row.days===undefined)){error('请填写任务名称、执行人和日期区间，预计天数需大于 0 或留空。');return;}
      rows.forEach(row=>{const id='t'+(++sequence);tasks.push({id,project:dialog.project,title:row.title,person:row.person,status:'未开始',priority:row.priority,milestone:row.milestone,creator:'解鹏'});arrangements.push({task:id,period:row.period,days:row.days,outside:false});});finish(`已保存 ${rows.length} 项模拟安排。`);return;
    }
    if(action==='save-periods'){
      const edited=Array.from(root.querySelectorAll('[data-period-id]')).map(row=>({id:row.dataset.periodId,start:row.querySelector('[data-date="start"]').value,end:row.querySelector('[data-date="end"]').value}));
      if(edited.some(p=>!p.start||!p.end||p.start>p.end)){error('请填写有效起止日期。');return;}
      if(edited.some((p,i)=>i>0&&p.start!==shiftDate(edited[i-1].end,1))){error('相邻日期区间应连续且不重叠，请同步调整前后边界。');return;}
      edited.forEach((p,i)=>Object.assign(periods[i],p));finish('日期区间已更新，两侧仍按相邻区间联动。');return;
    }
  });
  root.addEventListener('input',event=>{if(event.target.matches('[data-report-editor]'))currentReport().draft=event.target.value;});
  root.addEventListener('change',event=>{
    const control=event.target.dataset.control;
    if(control==='project'){state.project=event.target.value;render();remember();}
    if(control==='summaryPeriod'||control==='planPeriod'){linkPeriods(control,event.target.value);message='已切换至相邻的两个日期区间。';render();remember();}
  });

  /** 排序只改变同范围的顺序，不更改项目归属、负责人或日期区间。 */
  function reorder(kind,scope,id,targetId,after){
    if(id===targetId)return false;
    if(kind==='project'){
      const from=projects.findIndex(p=>p.id===id);if(from<0)return false;
      const [item]=projects.splice(from,1),to=projects.findIndex(p=>p.id===targetId);projects.splice(to+(after?1:0),0,item);
    }else{
      const [project,period]=scope.split(':');
      const from=arrangements.findIndex(a=>a.task===id&&a.period===period);
      const target=arrangements.find(a=>a.task===targetId&&a.period===period);
      if(from<0||!target||tasks.find(t=>t.id===targetId)?.project!==project)return false;
      const [item]=arrangements.splice(from,1);const to=arrangements.indexOf(target);arrangements.splice(to+(after?1:0),0,item);
    }
    return true;
  }
  function reorderNodes(kind,scope){return Array.from(root.querySelectorAll('[data-sort-kind]')).filter(node=>node.dataset.sortKind===kind&&node.dataset.sortScope===scope);}
  function clearDrag(){
    root.querySelectorAll('.w-dragging,.w-drop-before,.w-drop-after').forEach(node=>node.classList.remove('w-dragging','w-drop-before','w-drop-after'));
    root.querySelector('.w-drag-ghost')?.remove();
    if(drag?.handle.hasPointerCapture(drag.pointerId))drag.handle.releasePointerCapture(drag.pointerId);
    drag=null;
  }
  root.addEventListener('pointerdown',event=>{
    const handle=event.target.closest('[data-drag-kind]');if(!handle||event.button!==0||dialog)return;
    event.preventDefault();handle.focus();handle.setPointerCapture(event.pointerId);
    drag={handle,pointerId:event.pointerId,kind:handle.dataset.dragKind,id:handle.dataset.dragId,scope:handle.dataset.dragScope,startX:event.clientX,startY:event.clientY,started:false,target:null};
  });
  root.addEventListener('pointermove',event=>{
    if(!drag||event.pointerId!==drag.pointerId)return;
    if(!drag.started&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<5)return;
    if(!drag.started){drag.started=true;drag.handle.closest('[data-sort-kind]').classList.add('w-dragging');const ghost=document.createElement('div');ghost.className='w-drag-ghost';ghost.textContent=drag.kind==='project'?projectName(drag.id):tasks.find(t=>t.id===drag.id)?.title;app.appendChild(ghost);}
    const rect=app.getBoundingClientRect(),ghost=root.querySelector('.w-drag-ghost');ghost.style.left=Math.max(6,Math.min(event.clientX-rect.left+12,rect.width-200))+'px';ghost.style.top=Math.max(0,event.clientY-rect.top+12)+'px';
    root.querySelectorAll('.w-drop-before,.w-drop-after').forEach(node=>node.classList.remove('w-drop-before','w-drop-after'));
    const candidate=document.elementFromPoint(event.clientX,event.clientY)?.closest(`[data-sort-kind="${drag.kind}"]`);
    drag.target=null;
    if(candidate&&candidate.dataset.sortScope===drag.scope&&candidate.dataset.sortId!==drag.id){const bounds=candidate.getBoundingClientRect();drag.after=event.clientY>bounds.top+bounds.height/2;candidate.classList.add(drag.after?'w-drop-after':'w-drop-before');drag.target=candidate.dataset.sortId;}
  });
  root.addEventListener('pointerup',event=>{
    if(!drag||drag.pointerId!==event.pointerId)return;
    const {started,kind,scope,id,target,after}=drag;clearDrag();
    if(started&&target&&reorder(kind,scope,id,target,after)){message=kind==='project'?'项目顺序已调整，两栏和自动文字版同步。':'任务顺序已调整，仅影响所属项目的这个区间。';render();root.querySelector(`[data-drag-kind="${kind}"][data-drag-id="${id}"][data-drag-scope="${scope}"]`)?.focus();remember();}
  });
  root.addEventListener('pointercancel',clearDrag);
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&drag){clearDrag();event.preventDefault();return;}
    const handle=event.target.closest('[data-drag-kind]');
    if(handle&&['ArrowUp','ArrowDown'].includes(event.key)&&!dialog){
      event.preventDefault();const {dragKind:kind,dragScope:scope,dragId:id}=handle.dataset,nodes=reorderNodes(kind,scope),index=nodes.findIndex(node=>node.dataset.sortId===id),offset=event.key==='ArrowUp'?-1:1,target=nodes[index+offset];
      if(target&&reorder(kind,scope,id,target.dataset.sortId,offset>0)){message='顺序已调整。';render();root.querySelector(`[data-drag-kind="${kind}"][data-drag-id="${id}"][data-drag-scope="${scope}"]`)?.focus();remember();}return;
    }
    if(!dialog)return;
  });
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState&&!dialog&&!drag){restore(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{app.style.setProperty('--w-row-space',design.rowSpace+'px');app.style.setProperty('--w-column-gap',design.columnGap+'px');}});tweak.addSlider(design,'rowSpace',{label:'任务行留白',min:8,max:18,step:2,unit:'px'});tweak.addSlider(design,'columnGap',{label:'两栏间距',min:20,max:40,step:2,unit:'px'});}
})();

</script>
