</style>
<div id="ntfs-refined" aria-label="留白工作区优化版">
  <section data-variant="留白工作区" aria-label="留白工作区"><div class="n-app airy" data-design="airy" aria-label="留白工作区设计"></div></section>

</div>
<script>
(() => {
 const root=document.getElementById('ntfs-refined');
 const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
 const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const base=[
  {id:'NT-24',title:'任务看板与详情',status:'todo',kind:'前端',date:'10.22',people:['周','林'],desc:'将项目任务组织为看板和卡片。卡片可拖拽排序，点击后在详情中查看任务说明、分工和操作记录。',criteria:'卡片移动与显式操作遵循相同权限，失败时恢复原位置。'},
  {id:'NT-27',title:'周报汇总与发布',status:'todo',kind:'后端',date:'10.28',people:['林'],desc:'按项目汇总本周工作和下周安排，保留人工整理内容及已发布版本。',criteria:'重新生成不重复加入事项，不覆盖人工修改和已发布记录。'},
  {id:'NT-29',title:'手机端需求提交',status:'todo',kind:'前端',date:'10.28',people:['周'],desc:'从微信链接进入手机网页，填写并提交需求，按权限查看处理进度。',criteria:'窄屏表单可完整操作，分享链接不额外授予访问权限。'},
  {id:'NT-18',title:'项目权限校验',status:'doing',kind:'后端',date:'10.16',people:['林','许'],desc:'以当前用户角色和项目范围校验业务操作。网页、桌面和Agent共用同一套权限规则。',criteria:'覆盖项目成员、成员移出、账号禁用和越权操作场景。'},
  {id:'NT-22',title:'多端通知联调',status:'doing',kind:'联调',date:'10.22',people:['许','周'],blocked:true,desc:'验证网页和桌面的通知记录、已读同步与重连去重。当前等待测试环境就绪。',criteria:'同一事件不重复生成通知，系统弹窗展示不等于已读。'},
  {id:'NT-31',title:'开发环境与构建',status:'doing',kind:'工程',date:'',people:['许'],desc:'整理本地环境、启动脚本和基础构建流程，统一工程工具链。',criteria:'按文档能完成本地安装与构建，示例配置不包含真实凭据。'},
  {id:'NT-12',title:'账号与角色初始化',status:'done',kind:'后端',date:'10.12',people:['林'],desc:'完成团队初始化、成员账号和预设角色的基础流程。',criteria:'团队建立和角色分配遵循已有管理权限。'}
 ];
 const columns=[{key:'todo',name:'待安排'},{key:'doing',name:'进行中'},{key:'done',name:'已完成'}];
 const states=new Map();let drag=null;let activeTrigger=null;let suppressClick=false;let dragFrame=0;
 function refreshIcons(){root.querySelectorAll('button').forEach(button=>button.classList.add('cursor-interaction'));if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
 function people(names){return '<span class="n-people">'+names.map(name=>'<span class="n-person">'+esc(name)+'</span>').join('')+'</span>';}
 function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:null,privateContent:{views:Object.fromEntries([...states].map(([key,state])=>[key,state.view]))}}).catch(()=>{});}
 function shell(app){
  const design=app.dataset.design;const prior=window.openai?.widgetState?.privateContent?.views?.[design];
  const state={view:prior==='milestone'?'milestone':'board',tasks:base.map(t=>({...t,people:[...t.people]})),query:'',selected:null,message:''};states.set(design,state);
  const brand='<div class="n-brand" aria-label="下次一定"><span class="n-mark" aria-hidden="true"></span><span class="n-wordmark"><b>下次一定</b><small>NEXT TIME</small></span></div>';
  app.innerHTML='<div class="n-shell"><aside class="n-sidebar">'+brand+'<div class="n-nav">'+icon('inbox')+'我的工作</div><div class="n-nav">'+icon('bell')+'收件箱<span class="n-count">3</span></div><div class="n-nav-label">团队空间</div><div class="n-nav active">'+icon('layers')+'项目</div><div class="n-nav">'+icon('calendar-days')+'周计划</div><div class="n-nav">'+icon('file-text')+'周报</div><div class="n-nav-label">最近访问</div><div class="n-nav active">下次一定</div><div class="n-nav">客户服务平台</div><div class="n-sidebar-foot"><div class="n-row">'+people(['林'])+'<span>林然<br>产品研发团队</span></div></div></aside><main class="n-main"><header class="n-topnav">'+brand+'<nav class="n-toplinks"><span>我的工作</span><span class="active">项目</span><span>周计划</span><span>周报</span></nav></header><div class="n-crumb">项目 <span>／</span><span style="color:var(--n-ink)">下次一定</span><span class="n-grow"></span>'+icon('lock-keyhole')+'团队可见</div><header class="n-project-head"><div class="n-project-kicker">NEXT TIME, FOR SURE</div><div class="n-project-title"><h1>下次一定</h1>'+people(['林','周','许'])+'</div><p class="n-project-desc">从需求到交付，让团队的每一步都有着落。</p><nav class="n-tabs" aria-label="项目视图"><button class="n-tab" type="button" role="tab" data-view="board">'+icon('columns-3')+'任务看板</button><button class="n-tab" type="button" role="tab" data-view="milestone">'+icon('git-branch')+'里程碑</button></nav></header><div class="n-area"></div></main></div><div class="n-shade" hidden><section class="n-dialog" role="dialog" aria-modal="true" aria-label="任务详情"></section></div>';
  app.querySelector('.n-tabs').setAttribute('role','tablist');
  // 品牌属于应用导航，内容标题展示当前项目，避免重复系统名称。
  app.querySelector('.n-project-kicker').remove();
  app.querySelector('.n-project-desc').remove();
  app.querySelector('.n-project-title').innerHTML='<span class="n-project-symbol">'+icon('folder-kanban')+'</span><div class="n-project-copy"><h1>研发协同平台</h1><p class="n-project-desc">产品研发团队</p></div>'+people(['林','周','许']);
  app.querySelector('.n-crumb span').nextElementSibling.textContent='研发协同平台';
  app.querySelectorAll('.n-nav').forEach(item=>{if(item.textContent==='下次一定')item.textContent='研发协同平台';});
  app.querySelectorAll('[data-view]').forEach(button=>{button.id=design+'-'+button.dataset.view;button.setAttribute('aria-controls',design+'-panel');});
  app.querySelector('.n-area').id=design+'-panel';app.querySelector('.n-area').setAttribute('role','tabpanel');
  render(app);
 }
 function card(t){
  const action=t.status==='todo'?'<button type="button" class="n-quick" data-quick="start" data-id="'+esc(t.id)+'" aria-label="开始：'+esc(t.title)+'">'+icon('play')+'开始</button>':t.status==='doing'?'<button type="button" class="n-quick" data-quick="end" data-id="'+esc(t.id)+'" aria-label="结束整体任务：'+esc(t.title)+'">'+icon('circle-check')+'结束</button>':'<span class="n-card-complete">'+icon('check')+'已完成</span>';
  return '<article class="n-task" draggable="false" data-card="'+esc(t.id)+'"><button type="button" class="n-task-open" data-task="'+esc(t.id)+'" aria-label="查看任务：'+esc(t.title)+'"><div class="n-task-id">'+esc(t.id)+icon('grip-vertical')+'</div><div class="n-task-title">'+esc(t.title)+'</div><div class="n-row"><span class="n-tag">'+esc(t.kind)+'</span>'+(t.blocked?'<span class="n-tag warning">'+icon('pause')+'有阻塞</span>':'')+'</div><div class="n-task-foot">'+icon(t.status==='done'?'circle-check':'calendar-days')+'<span>'+esc(t.date||'未设日期')+'</span><span class="n-grow"></span>'+people(t.people)+'</div></button><div class="n-card-actions">'+action+'</div></article>';
 }
 function renderBoard(app,state){
  const list=state.tasks.filter(t=>!state.query||t.title.includes(state.query)||t.id.toLowerCase().includes(state.query.toLowerCase()));
  return '<div class="n-toolbar"><label class="n-search">'+icon('search')+'<input type="search" aria-label="搜索任务" placeholder="搜索任务" value="'+esc(state.query)+'"></label><span class="n-grow"></span><span class="n-muted n-tiny">'+list.length+' 个任务</span><button class="n-btn primary" data-add="todo">'+icon('plus')+'新建任务</button></div><div class="n-board">'+columns.map(col=>'<section class="n-column" data-column="'+col.key+'" aria-label="'+col.name+'"><div class="n-column-head"><span class="n-state-dot '+col.key+'"></span>'+col.name+'<span class="n-muted n-tiny">'+list.filter(t=>t.status===col.key).length+'</span><span class="n-grow"></span><button class="n-icon" data-add="'+col.key+'" aria-label="在'+col.name+'添加任务">'+icon('plus')+'</button></div><div class="n-cards">'+list.filter(t=>t.status===col.key).map(card).join('')+'</div><button class="n-add" data-add="'+col.key+'">'+icon('plus')+'添加任务</button></section>').join('')+'</div>';
 }
 function taskState(t){return columns.find(c=>c.key===t.status)?.name||'待安排';}
 function renderFish(app,state){
  const dates=['10.12','10.16','10.22','10.28'];
  return '<div class="n-roadmap-tools"><div><span style="font-weight:500">2026 年 10 月</span><span class="n-muted n-small">　项目建设规划</span></div><div class="n-legend"><span><i class="n-state-dot done"></i>已完成</span><span><i class="n-state-dot doing"></i>进行中</span><span><i class="n-state-dot"></i>待安排</span></div></div><div class="n-fish" aria-label="按预计完成日期组织的鱼骨式里程碑"><svg class="n-bones" aria-hidden="true"></svg>'+dates.map((date,index)=>'<section class="n-fish-group" data-date="'+date+'" data-index="'+index+'"><div class="n-fish-date"><span>'+date.replace('.',' / ')+'</span><span class="n-muted">预计完成</span></div>'+state.tasks.filter(t=>t.date===date).map(t=>'<button class="n-node-task" data-task="'+t.id+'"><span class="n-node-title">'+esc(t.title)+'</span><span class="n-node-status"><i class="n-state-dot '+t.status+'"></i>'+taskState(t)+(t.blocked?' · 有阻塞':'')+'</span></button>').join('')+'</section>').join('')+'</div><div class="n-unplanned"><span class="n-muted">未规划 <span class="n-tiny">'+state.tasks.filter(t=>!t.date).length+'</span></span>'+state.tasks.filter(t=>!t.date).map(t=>'<button class="n-unscheduled-task" data-task="'+t.id+'">'+esc(t.title)+'<span class="n-muted n-tiny">未设日期</span>'+icon('arrow-up-right')+'</button>').join('')+'</div>';
 }
 function render(app){
  const state=states.get(app.dataset.design);app.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.view===state.view)));
  const area=app.querySelector('.n-area');area.setAttribute('aria-labelledby',app.dataset.design+'-'+state.view);
  area.innerHTML=(state.view==='board'?renderBoard(app,state):renderFish(app,state))+'<footer class="n-footnote"><span class="n-row">'+icon(state.view==='board'?'mouse-pointer-2':'git-branch')+(state.view==='board'?'拖拽卡片排序或移动 · 点击查看详情':'时间主轴与上下分支 · 点击事项查看任务')+'</span><span>交互预览 · 示例数据</span></footer><div class="n-tiny n-muted" style="min-height:18px;margin-top:6px" role="status">'+esc(state.message)+'</div>';
  refreshIcons();requestAnimationFrame(()=>drawBones(app));
 }
 function drawBones(app){
  const fish=app.querySelector('.n-fish');if(!fish||fish.clientWidth===0||fish.clientWidth<400)return;
  const width=fish.clientWidth,y=226,svg=fish.querySelector('svg');svg.setAttribute('viewBox','0 0 '+width+' 470');
  let lines='<path class="n-axis" d="M 8 '+y+' H '+(width-8)+' m -7 -4 l 7 4 -7 4"/>';
  fish.querySelectorAll('.n-axis-date').forEach(el=>el.remove());
  fish.querySelectorAll('.n-fish-group').forEach((group,index)=>{
   const upper=index%2===0;const sourceX=group.offsetLeft+group.offsetWidth*.4;const sourceY=upper?group.offsetTop+group.offsetHeight:group.offsetTop;const axisX=Math.min(width-18,sourceX+group.offsetWidth*.42);
   lines+='<path class="n-branch" d="M '+sourceX+' '+sourceY+' L '+axisX+' '+y+'"/><circle class="n-spine-node" cx="'+axisX+'" cy="'+y+'" r="3"/>';
   const label=document.createElement('span');label.className='n-axis-date';label.textContent=group.dataset.date;label.style.left=axisX+'px';fish.appendChild(label);
  });svg.innerHTML=lines;
 }
 /** 详情只展示有内容的选填项，进入编辑后才显示两个输入框。 */
 function renderTaskInformation(app,task,editing=false){
  const fields=[{key:'desc',label:'任务说明'},{key:'criteria',label:'完成标准'}];
  const content=fields.map(field=>{
   const value=String(task[field.key]||'').trim(),id=app.dataset.design+'-'+field.key;
   if(editing)return '<label for="'+id+'">'+field.label+' <span class="n-muted n-tiny">选填</span></label><textarea id="'+id+'" data-info="'+field.key+'">'+esc(value)+'</textarea>';
   return value?'<section class="n-optional-field" data-info-section="'+field.key+'"><h3>'+field.label+'</h3><p class="n-field-copy">'+esc(value)+'</p></section>':'';
  }).join('');
  const main=app.querySelector('.n-dialog-grid > div');
  main.innerHTML=(editing?'<div class="n-info-edit">'+content+'</div>':content)+'<h3>最近动态</h3><div class="n-activity">'+(task.infoUpdated?'林然更新了任务信息 · 刚刚':'任务已创建')+'</div>'+(task.blocked?'<div class="n-confirm">有阻塞：等待测试环境就绪。<br>移动卡片不会自动解除阻塞。</div>':'');
  app.querySelector('.n-dialog-footer').innerHTML=(editing?'<button class="n-btn primary" data-save>保存</button><button class="n-btn" data-cancel-edit>取消编辑</button>':'<button class="n-btn" data-edit-info>'+icon('pencil')+'编辑任务信息</button><button class="n-btn" data-close>关闭</button>')+'<span class="n-grow"></span><span class="n-tiny n-muted">示例操作，不提交业务数据</span>';
  refreshIcons();
  if(editing)main.querySelector('textarea').focus();
 }
 function openDialog(app,id,pendingStatus){
  const state=states.get(app.dataset.design),task=state.tasks.find(t=>t.id===id);if(!task)return;state.selected=id;
  const dialog=app.querySelector('.n-dialog');
  dialog.innerHTML='<div class="n-dialog-top"><span>'+esc(task.id)+'　／　'+taskState(task)+'</span><button class="n-icon" data-close aria-label="关闭任务详情">'+icon('x')+'</button></div><h2>'+esc(task.title)+'</h2><div class="n-dialog-grid"><div></div><aside><div class="n-detail-label" style="margin-top:0">任务主负责人</div><div class="n-row">'+people(['林'])+'林然</div><div class="n-detail-label">参与成员</div>'+people(task.people)+'<div class="n-detail-label">预计交付</div><div class="n-small">'+esc(task.date||'未设日期')+'</div><div class="n-move-box"><label for="'+app.dataset.design+'-move">移动到列表</label><select id="'+app.dataset.design+'-move" data-destination>'+columns.map(c=>'<option value="'+c.key+'" '+(c.key===(pendingStatus||task.status)?'selected':'')+'>'+c.name+'</option>').join('')+'</select><button class="n-btn" data-move style="margin-top:9px;width:100%">移动</button></div></aside></div><div class="n-confirm" data-confirm hidden><strong style="font-weight:500">确认结束整体任务？</strong><p style="margin:6px 0 10px">请先检查未完成分工及关联工作。结束后保留历史，不代替参与人确认个人完成。</p><button class="n-btn primary" data-confirm-move>确认结束</button> <button class="n-btn" data-cancel-move>取消</button></div><footer class="n-dialog-footer"><button class="n-btn primary" data-save>保存说明</button><button class="n-btn" data-close>关闭</button><span class="n-grow"></span><span class="n-tiny n-muted">示例操作，不提交业务数据</span></footer>';
  renderTaskInformation(app,task);
  app.querySelector('.n-shade').hidden=false;refreshIcons();dialog.querySelector('[data-close]').focus();
  if(pendingStatus==='done')dialog.querySelector('[data-confirm]').hidden=false;
 }
 function closeDialog(app){app.querySelector('.n-shade').hidden=true;if(activeTrigger?.isConnected)activeTrigger.focus();}
 function move(app,id,to,beforeId,animate=true){
  const state=states.get(app.dataset.design);const index=state.tasks.findIndex(t=>t.id===id);if(index<0)return;const task=state.tasks[index];
  if(to==='done'&&task.status!=='done'){openDialog(app,id,'done');return;}
  const positions=animate?snapshotLayout(app):null;
  state.tasks.splice(index,1);task.status=to;const target=beforeId?state.tasks.findIndex(t=>t.id===beforeId):-1;
  if(target<0)state.tasks.push(task);else state.tasks.splice(target,0,task);
  state.message='预览已更新：'+task.title+' → '+taskState(task);render(app);if(positions)animateLayout(app,positions);
 }
 function addDialog(app,status){
  const dialog=app.querySelector('.n-dialog');dialog.innerHTML='<div class="n-dialog-top"><span>创建任务 · 示例</span><button class="n-icon" data-close aria-label="关闭新增任务">'+icon('x')+'</button></div><h2>添加到'+columns.find(c=>c.key===status).name+'</h2><div data-create-form data-status="'+status+'"><label for="'+app.dataset.design+'-new-title">任务名称</label><input id="'+app.dataset.design+'-new-title" name="title" required maxlength="60" placeholder="例如：补充通知设置页面"><div class="n-dialog-footer"><button class="n-btn primary" type="button" data-create>添加</button><button class="n-btn" type="button" data-close>取消</button></div></div>';
  app.querySelector('.n-shade').hidden=false;refreshIcons();dialog.querySelector('input').focus();
 }
 root.querySelectorAll('.n-app').forEach(shell);
 root.addEventListener('click',event=>{
  if(suppressClick){suppressClick=false;return;}
  const app=event.target.closest('.n-app');if(!app)return;const state=states.get(app.dataset.design);
  const tab=event.target.closest('[data-view]');if(tab){state.view=tab.dataset.view;state.message='';render(app);remember();return;}
  const quick=event.target.closest('[data-quick]');if(quick){activeTrigger=quick;if(quick.dataset.quick==='start')move(app,quick.dataset.id,'doing');else openDialog(app,quick.dataset.id,'done');return;}
  const cardButton=event.target.closest('[data-task]');if(cardButton){activeTrigger=cardButton;openDialog(app,cardButton.dataset.task);return;}

 /** 记录卡片当前位置，用于列表让位和快捷操作后的过渡。 */
 function snapshotLayout(app){return new Map([...app.querySelectorAll('[data-card]:not(.drag-origin)')].map(el=>[el.dataset.card,el.getBoundingClientRect()]));}
 function motionDuration(value){return matchMedia('(prefers-reduced-motion: reduce)').matches?0:value;}
 function animateLayout(app,before){
  app.querySelectorAll('[data-card]:not(.drag-origin)').forEach(el=>{
   const previous=before.get(el.dataset.card);if(!previous)return;
   el.getAnimations().forEach(animation=>animation.cancel());
   const next=el.getBoundingClientRect(),dx=previous.left-next.left,dy=previous.top-next.top;
   if(Math.abs(dx)+Math.abs(dy)<1)return;
   el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'translate(0,0)'}],{duration:motionDuration(180),easing:'cubic-bezier(.2,.8,.2,1)'});
  });

 /** 拖动时只操作占位框，松手并确认后才改变预览中的任务状态。 */
 function startDrag(current){
  const bounds=current.source.getBoundingClientRect();current.started=true;current.width=bounds.width;current.originRect=bounds;

  current.ghost.querySelectorAll('button').forEach(button=>{button.disabled=true;button.removeAttribute('data-task');button.removeAttribute('data-quick');});
  current.ghost.style.width=bounds.width+'px';current.app.appendChild(current.ghost);current.source.classList.add('drag-origin');root.setPointerCapture(current.pointerId);

 function paintDrag(){
  dragFrame=0;const current=drag;if(!current?.started||current.settling)return;

  current.ghostY=Math.max(0,Math.min(appBox.height-current.originRect.height,current.y-appBox.top-current.offsetY));
  current.ghost.style.transform='translate3d('+current.ghostX+'px,'+current.ghostY+'px,0)';

  // 浮动卡片不接收指针，命中位置由其下方的列表决定。
  const under=document.elementFromPoint(current.x,current.y),column=under?.closest('[data-column]');
  current.targetColumn=column&&column.closest('.n-app')===current.app?column:null;
  current.app.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
  if(!current.targetColumn)return;
  column.classList.add('over');const list=column.querySelector('.n-cards');
  const siblings=[...list.querySelectorAll('[data-card]:not(.drag-origin)')];
  // 扣除让位动画的位移后判断插入位置，避免在同一位置反复交换。
  const before=siblings.find(el=>{const top=el.getBoundingClientRect().top;const visualTransform=new DOMMatrix(getComputedStyle(el).transform);return current.y<top-visualTransform.m42+el.offsetHeight/2;});

 }
 function cleanupDrag(current){
  if(dragFrame){cancelAnimationFrame(dragFrame);dragFrame=0;}
  current.ghost?.remove();current.placeholder?.remove();current.source.classList.remove('drag-origin');
  current.app.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
  if(root.hasPointerCapture(current.pointerId))root.releasePointerCapture(current.pointerId);

 async function finishDrag(cancelled=false){
  const current=drag;if(!current||current.settling)return;
  if(!current.started){drag=null;return;}
  paintDrag();current.settling=true;suppressClick=true;setTimeout(()=>{suppressClick=false;},0);
  const column=cancelled?null:current.targetColumn;
  const target=column?current.placeholder.getBoundingClientRect():current.originRect;
  const appBox=current.app.getBoundingClientRect();
  let next=current.placeholder.nextElementSibling;while(next?.classList.contains('drag-origin'))next=next.nextElementSibling;
  const beforeId=column?next?.dataset.card:undefined;
  try{await current.ghost.animate([{transform:current.ghost.style.transform},{transform:'translate3d('+(target.left-appBox.left)+'px,'+(target.top-appBox.top)+'px,0)'}],{duration:motionDuration(150),easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;}catch{}
  cleanupDrag(current);
  if(column)move(current.app,current.id,column.dataset.column,beforeId,false);
 }

  if(drag||event.target.closest('[data-quick]')||event.button!==0||event.pointerType==='touch')return;

  drag={id:card.dataset.card,app:card.closest('.n-app'),startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,pointerId:event.pointerId,started:false,source:card};

  if(!drag||drag.pointerId!==event.pointerId||drag.settling)return;drag.x=event.clientX;drag.y=event.clientY;
